services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: aulacheck-openldap
    restart: unless-stopped
    ports:
      - "389:389"
      - "636:636"
    environment:
      LDAP_ORGANISATION: "Universidad Aula Check"
      LDAP_DOMAIN: "aulacheck.edu.co"
      LDAP_BASE_DN: "dc=aulacheck,dc=edu,dc=co"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:-AulaCheckAdmin2026*}"
      LDAP_CONFIG_PASSWORD: "${LDAP_CONFIG_PASSWORD:-AulaCheckConfig2026*}"
      LDAP_RFC2307BIS_SCHEMA: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
      LDAP_TLS: "true"
      LDAP_TLS_VERIFY_CLIENT: "never"
    volumes:
      - ./data/slapd/database:/var/lib/ldap
      - ./data/slapd/config:/etc/ldap/slapd.d
      - ./bootstrap.ldif:/bootstrap/bootstrap.ldif:ro
    networks:
      - aulacheck_ldap_net

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: aulacheck-phpldapadmin
    restart: unless-stopped
    depends_on:
      - openldap
    ports:
      # Puerto 8081 para no colisionar con AdGuard Home Web UI (puerto 8080)
      - "8081:80"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    networks:
      - aulacheck_ldap_net

networks:
  aulacheck_ldap_net:
    driver: bridge
